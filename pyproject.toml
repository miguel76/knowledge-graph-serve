[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kgserve"
description = "Serve a knowledge graph published on Zenodo as a SPARQL endpoint and as Linked Data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.1,<8"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kgserve = "kgserve.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "kgserve.__version__" }

[tool.setuptools.packages.find]
include = ["kgserve*"]
