# Default stack: Oxigraph (managed by the sync service) + linked-data server + nginx.
# Configure it with a .env file (see .env.example, or run `kgserve init <record>`).
# Other triple stores: add `-f compose.graphdb.yaml` or `-f compose.fuseki.yaml`.
# HTTPS with Let's Encrypt: add `-f compose.tls.yaml`.

x-kgserve-env: &kgserve-env
  env_file:
    - path: .env
      required: false

services:
  # Watches the Zenodo record, loads each new release and (with Oxigraph) serves SPARQL.
  store:
    <<: *kgserve-env
    build: .
    image: kgserve:latest
    command: ["sync"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - ${DATA_PATH:-./data}:/data
    stop_grace_period: 30s

  # Resource pages and RDF serialisations for the IRIs of the knowledge graph.
  linked-data:
    <<: *kgserve-env
    image: kgserve:latest
    command: ["ld"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT:-http://store:7878/query}
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    depends_on:
      - store

  web:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      BASE_PATH: ${BASE_PATH:-/kg}
      RESOURCE_PATH: ${RESOURCE_PATH:-${BASE_PATH:-/kg}/id}
      SPARQL_UPSTREAM: ${SPARQL_ENDPOINT:-http://store:7878/query}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/extra:/etc/nginx/extra:ro
    depends_on:
      - store
      - linked-data
