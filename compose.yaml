# Serves one knowledge graph from Zenodo. Put this file in an empty directory with a
# config.json (only "zenodo" is required, e.g. {"zenodo": "10.5281/zenodo.24305088"}), then:
#   docker compose up -d
# The service is at http://127.0.0.1:8080/ (KG_LISTEN); mount it in a front web server to
# publish it (see README). Data are kept in ./data. Other triple stores: add
# -f compose.fuseki.yaml or -f compose.graphdb.yaml.
#
# The images are published from https://github.com/miguel76/knowledge-graph-serve:
# KG_VERSION selects a release, KG_REGISTRY another registry. In a checkout of the
# repository, docker compose up -d --build builds them from the source instead.

x-kgserve: &kgserve
  image: ${KG_REGISTRY:-ghcr.io/miguel76}/knowledge-graph-serve:${KG_VERSION:-latest}
  build:
    context: .
    target: kgserve
  restart: unless-stopped
  environment:
    KG_STORE_TYPE: oxigraph
  volumes:
    - ./config.json:/config/config.json:ro
    - ./data/sync:/data

services:
  # The triple store, from its vendor image. Written only by the sync service.
  store:
    image: ghcr.io/oxigraph/oxigraph:0.5.13
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878",
              "--union-default-graph", "--timeout-s", "60"]
    restart: unless-stopped
    volumes:
      - ./data/store:/data

  # Checks the Zenodo record periodically and loads each new release into the store.
  sync:
    <<: *kgserve
    command: ["sync"]
    depends_on:
      - store

  # Resource pages and RDF serialisations, landing page, SPARQL editor.
  linked-data:
    <<: *kgserve
    command: ["ld"]
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data/sync:/data:ro
    depends_on:
      - store

  # nginx (nginx/default.conf.template): /sparql to the store, the rest to linked-data.
  web:
    image: ${KG_REGISTRY:-ghcr.io/miguel76}/knowledge-graph-serve-web:${KG_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${KG_LISTEN:-127.0.0.1:8080}:80"
    environment:
      # The SPARQL endpoint, and the one for explicit statements only (?infer=false).
      SPARQL_UPSTREAM: http://store:7878/query
      SPARQL_UPSTREAM_EXPLICIT: http://store:7878/query
    depends_on:
      - store
      - linked-data
