# Serves one knowledge graph from Zenodo. Configure it in config.json (only "zenodo" is
# required), then: docker compose up -d
# The service is at http://127.0.0.1:8080/ (KG_LISTEN); mount it in a front web server to
# publish it (see README). Other triple stores: add -f compose.fuseki.yaml or
# -f compose.graphdb.yaml.

x-kgserve: &kgserve
  build: .
  image: kgserve:latest
  restart: unless-stopped
  environment:
    KG_STORE_TYPE: oxigraph
  volumes:
    - ./config.json:/config/config.json:ro
    - ./data/sync:/data

services:
  # The triple store, from its vendor image. Written only by the sync service.
  store:
    image: ghcr.io/oxigraph/oxigraph:0.5.13
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878",
              "--union-default-graph", "--timeout-s", "60"]
    restart: unless-stopped
    volumes:
      - ./data/store:/data

  # Checks the Zenodo record periodically and loads each new release into the store.
  sync:
    <<: *kgserve
    command: ["sync"]
    depends_on:
      - store

  # Resource pages and RDF serialisations, landing page, SPARQL editor.
  linked-data:
    <<: *kgserve
    command: ["ld"]
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data/sync:/data:ro
    depends_on:
      - store

  web:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${KG_LISTEN:-127.0.0.1:8080}:80"
    environment:
      # The SPARQL endpoint, and the one for explicit statements only (?infer=false).
      SPARQL_UPSTREAM: http://store:7878/query
      SPARQL_UPSTREAM_EXPLICIT: http://store:7878/query
    volumes:
      - ./nginx:/etc/nginx/templates:ro
    depends_on:
      - store
      - linked-data
