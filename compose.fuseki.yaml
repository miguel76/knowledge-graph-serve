# Use Apache Jena Fuseki (TDB, union default graph, Lucene index on labels) as the store:
#   docker compose -f compose.yaml -f compose.fuseki.yaml up -d
# Only its query endpoints are reachable from outside (through nginx): the service "kg",
# with the inference regime of config.json ("inference"), and, with infer=false, "ds".
# fuseki/entrypoint.sh reads the regime when the store starts: restart it after a change.
# The store image is secoresearch/fuseki with that entrypoint (Dockerfile, target fuseki).

services:
  store:
    image: ${KG_REGISTRY:-ghcr.io/miguel76}/knowledge-graph-serve-fuseki:${KG_VERSION:-latest}
    build:
      context: .
      target: fuseki
    command: !reset []
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-change-me}
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      QUERY_TIMEOUT: "60000"
      # Read by the java launcher (the image's command ignores JAVA_OPTIONS).
      JDK_JAVA_OPTIONS: -Xmx4g
    volumes: !override
      - ./data/store:/fuseki-base/databases
      - ./config.json:/config/config.json:ro

  sync:
    environment:
      KG_STORE_TYPE: fuseki

  linked-data:
    environment:
      KG_STORE_TYPE: fuseki

  web:
    environment:
      SPARQL_UPSTREAM: http://store:3030/kg/sparql
      SPARQL_UPSTREAM_EXPLICIT: http://store:3030/ds/sparql
