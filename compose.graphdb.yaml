# Use GraphDB as the store:
#   docker compose -f compose.yaml -f compose.graphdb.yaml up -d
# GraphDB 11 needs a license file, also for the free edition: put it in ./graphdb.license.
# The sync creates the repository "kg", with the ruleset of config.json ("inference"), and
# replaces its content in one transaction per release. The Workbench is published on
# 127.0.0.1:7200 only.

services:
  store:
    image: ontotext/graphdb:11.5.2
    command: !reset []
    ports:
      - "127.0.0.1:7200:7200"
    environment:
      GDB_JAVA_OPTS: -Xmx4g
    volumes: !override
      - ./data/store:/opt/graphdb/home
      - ./graphdb.license:/opt/graphdb/dist/conf/graphdb.license:ro

  sync:
    environment:
      KG_STORE_TYPE: graphdb

  linked-data:
    environment:
      KG_STORE_TYPE: graphdb

  web:
    environment:
      SPARQL_UPSTREAM: http://store:7200/repositories/kg
      SPARQL_UPSTREAM_EXPLICIT: http://store:7200/repositories/kg
