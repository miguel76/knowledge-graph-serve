# Tests kgserve, builds the images of the Dockerfile and publishes them to the GitHub
# Container Registry (ghcr.io/<owner>/knowledge-graph-serve, -web and -fuseki):
#   * a push to main publishes :latest (and :sha-<commit>);
#   * a tag vX.Y.Z publishes :X.Y.Z and :X.Y, and creates the GitHub release of that
#     version, with the compose files pinned to it as assets;
#   * a pull request only builds them.
# To publish to Docker Hub too, set the repository variable DOCKERHUB_NAMESPACE (a Docker
# Hub user or organisation) and the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install '.[test]'

      - run: python -m pytest -q

      - name: Check that the tag is the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c 'import kgserve; print(kgserve.__version__)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but kgserve/__init__.py says $version"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: kgserve
            name: knowledge-graph-serve
          - target: web
            name: knowledge-graph-serve-web
          - target: fuseki
            name: knowledge-graph-serve-fuseki
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.name }},enable=${{ vars.DOCKERHUB_NAMESPACE != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin the compose files to this version
        run: |
          mkdir dist
          for f in compose.yaml compose.fuseki.yaml compose.graphdb.yaml; do
            sed "s/\${KG_VERSION:-latest}/\${KG_VERSION:-${GITHUB_REF_NAME#v}}/" "$f" > "dist/$f"
          done
          cp config.example.json dist/
          grep -q "KG_VERSION:-${GITHUB_REF_NAME#v}" dist/compose.yaml

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
